    <section class="contact">
        <div class="title-section">
            <h1>Contact</h1>
        </div>

        <div class="content">

            <div class="form-container">
                <h2>Formulaire de Contact 📩</h2>
                <form action="#" method="post">
                    <input type="text" name="name" placeholder="Votre nom" required>
                    <input type="email" name="email" placeholder="Votre email" required>
                    <textarea name="message" rows="4" placeholder="Votre message" required></textarea>
                    <button type="submit">Envoyer</button>
                </form>
            </div>

            <div class="contact-info">
                <h2>Mes Contacts 📲</h2>

                <div class="contact-item">
                    <i class="fab fa-linkedin contact-logo"></i>
                    <img src="logo/pngegg(6).png" alt="LinkedIn Logo" class="contact-logo">
                    <p><a href="https://www.linkedin.com/in/balqisse-messaya-09a641280/" target="_blank">balqisse messaya</a></p>
                </div>

                <div class="contact-item">
                    <i class="fas fa-envelope contact-logo"></i>
                    <img src="logo/pngegg(7).png" alt="email Logo" class="contact-logo">
                    <p><a href="mailto:balqisse.messaya@laplateforme.io">balqisse.messaya@laplateforme.io</a></p>
                </div>

                <div class="contact-item">
                    <i class="fab fa-github contact-logo"></i>
                    <img src="logo/logogithub.png" alt="github Logo" class="contact-logo">
                    <p><a href="https://github.com/balqisse-messaya" target="_blank">balqisse sur GitHub</a></p>
                </div>

                <div class="contact-item">
                    <i class="fas fa-phone contact-logo"></i>
                    <img src="logo/telephone.png" alt="telephone Logo" class="contact-logo">
                    <p><a href="tel:+33759533743">+33 7 59 53 37 43</a></p>
                </div>

                <div class="contact-item">
                    <i class="fas fa-map-marker-alt contact-logo"></i>
                    <img src="logo/localisationlogo.png" alt="localisation Logo" class="contact-logo">
                    <p>France 🇫🇷</p>
                </div>

        </div>
    </section>
